apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: backend_ro
    secureJsonData:
      password: ${TSDB_RO_PASSWORD}
    database: ${POSTGRES_DB}
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
