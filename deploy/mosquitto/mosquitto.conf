# Mosquitto — perfil de PRODUCCIÓN (acceso autenticado; sin anónimo).
# El perfil de desarrollo (compose.override.yaml) relaja allow_anonymous para el lab.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Límites básicos
max_queued_messages 1000
max_inflight_messages 20
