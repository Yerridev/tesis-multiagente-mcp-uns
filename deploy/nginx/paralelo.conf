# Nginx del STACK PARALELO (mcp-py): igual que default.conf, pero SOLO LECTURA.
# Bloquea toda escritura de control y de simulación: este stack NUNCA publica
# órdenes a los PLC (el stack original sigue siendo el único que controla).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health del propio Nginx (healthcheck de Docker)
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- proxy del canal de telemetría (SSE) ---
    # Server-Sent Events: el backend empuja la telemetría en vivo.  Nginx no
    # debe bufferizar la respuesta ni cortarla por inactividad.
    location = /api/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- SOLO LECTURA: control y simulación bloqueados (solo GET) ---
    location /api/control/ {
        limit_except GET { deny all; }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/sim/ {
        limit_except GET { deny all; }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- proxy REST ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # --- health del backend (uso interno/tests) ---
    location /health/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # --- SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets con hash: cache largo
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
