apiVersion: 1
datasources:
  - name: TimescaleDB-UNS
    uid: timescale-uns
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: ${DB_USER}
    isDefault: true
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: ${DB_PASSWORD}
